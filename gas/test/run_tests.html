<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Test Code.gs</title>
<style>body{font:13px/1.5 Consolas,monospace;padding:16px;background:#fff;color:#111} .ok{color:#2f9e44} .fail{color:#c92a2a;font-weight:700} h2{font:600 15px system-ui}</style></head>
<body>
<h2>Test backend gas/Code.gs trên môi trường Google giả lập (dữ liệu giả)</h2>
<pre id="out"></pre>
<script src="mock_gas.js"></script>
<script>
(async () => {
  const out = document.getElementById("out"), M = window.__gas;
  let pass = 0, fail = 0;
  const check = (name, cond, extra) => { cond ? pass++ : fail++; out.innerHTML += `<span class="${cond ? "ok" : "fail"}">${cond ? "[OK]  " : "[FAIL]"}</span> ${name}${!cond && extra !== undefined ? "  → " + JSON.stringify(extra).slice(0, 300) : ""}\n`; };
  // nạp Code.gs vào global; ?src=… để test bản đã nén (SHEET_ID đặt về '' để dùng Sheet giả lập)
  const src = new URLSearchParams(location.search).get("src") || "../Code.gs";
  (0, eval)((await (await fetch(src)).text()).replace(/const SHEET_ID\s*=\s*'[^']*'/, "const SHEET_ID=''"));

  const call = (action, p = {}) => gasCall({ action, ...p });
  const sheetRows = (n) => SpreadsheetApp.getActiveSpreadsheet().getSheetByName(n).getDataRange().getValues().slice(1).filter((r) => r.some((x) => x !== ""));
  const OWNER = "owner@gmail.com";

  // ---- setup ----
  setup(); setup();
  check("setup tạo đủ 8 tab", ["users", "settings", "wm_versions", "bhx_stores", "bhx_changes", "comp_stores", "comp_changes", "access_log"].every((n) => SpreadsheetApp.getActiveSpreadsheet().getSheetByName(n)));
  check("setup 2 lần: vẫn 1 Admin (chủ Sheet, viết thường)", sheetRows("users").length === 1 && sheetRows("users")[0][0] === OWNER && sheetRows("users")[0][1] === "admin");
  check("setup 2 lần: đúng 3 lịch (purge hằng giờ + BHX 06:00 + chuỗi khác 07:00), không trùng",
    M.triggers.length === 3 && M.triggers.some((t) => t.getHandlerFunction() === "purgeExpiredWm" && t.spec.everyHours === 1)
    && M.triggers.some((t) => t.getHandlerFunction() === "syncBhxDaily" && t.spec.atHour === 6 && t.spec.everyDays === 1)
    && M.triggers.some((t) => t.getHandlerFunction() === "syncCompDaily" && t.spec.atHour === 7 && t.spec.everyDays === 1));
  const SECRET = M.props.get("SYNC_SECRET");
  check("setup tạo SYNC_SECRET 64 ký tự", SECRET && SECRET.length === 64);

  // ---- Mật khẩu ----
  const PWREC = (e) => JSON.parse(M.props.get("pw:" + e) || "null");
  const clearFail = (e) => M.cache.delete("pwfail:" + e);
  let r = call("login", { email: "la@gmail.com", password: "abcd1234" });
  check("email lạ: báo cùng 1 câu (không lộ email nào có quyền)", r.error === "Email hoặc mật khẩu không đúng.", r);
  check("email lạ: ghi nhật ký 'denied'", sheetRows("access_log").some((x) => x[1] === "la@gmail.com" && x[2] === "denied"));
  r = call("login", { email: OWNER, password: "abcd1234" });
  check("email có quyền nhưng chưa có mật khẩu: cùng câu báo lỗi", r.error === "Email hoặc mật khẩu không đúng.", r);
  clearFail(OWNER);
  r = call("login", { email: "khong-phai-email", password: "x" });
  check("email sai định dạng → lỗi", /không hợp lệ/.test(r.error));
  taoMatKhauAdmin();
  check("taoMatKhauAdmin tạo mật khẩu tạm có hạn 7 ngày", PWREC(OWNER) && Math.abs(PWREC(OWNER).t - Date.now() - 7 * 864e5) < 60e3);
  const TEMP = tempPassword_(OWNER);
  check("chỉ lưu muối + hash, không có mật khẩu gốc", ![...M.props.values(), ...M.props.keys()].some((v) => String(v).includes(TEMP)) && !sheetRows("access_log").flat().some((v) => String(v).includes(TEMP)));
  r = call("login", { email: "  OWNER@gmail.com ", password: TEMP });
  check("mật khẩu tạm đúng (email viết hoa, có khoảng trắng) → phải đổi, CHƯA có phiên", r.ok && r.data.mustChange === true && !r.data.token, r);
  check("mật khẩu tạm không mở phiên nào", ![...M.props.keys()].some((k) => k.startsWith("sess:")));
  r = call("changePassword", { email: OWNER, password: TEMP, newPassword: "ngan" });
  check("mật khẩu mới quá ngắn → lỗi", /8/.test(r.error), r);
  r = call("changePassword", { email: OWNER, password: TEMP, newPassword: TEMP });
  check("mật khẩu mới trùng mật khẩu cũ → lỗi", /khác/.test(r.error), r);
  r = call("changePassword", { email: OWNER, password: "sai-mat-khau", newPassword: "matkhau-moi-1" });
  check("đổi mật khẩu với mật khẩu cũ sai → lỗi", /không đúng/.test(r.error), r);
  clearFail(OWNER);
  r = call("changePassword", { email: OWNER, password: TEMP, newPassword: "matkhau-moi-1" });
  check("đặt mật khẩu mới → có phiên", r.ok && r.data.token && r.data.role === "admin", r);
  r = call("login", { email: OWNER, password: TEMP });
  check("mật khẩu tạm không dùng lại được", !!r.error);
  clearFail(OWNER);
  const PW = "matkhau-moi-1";
  r = call("login", { email: OWNER, password: "matkhau-sai-2" });
  check("sai mật khẩu → lỗi, nhật ký 'login_fail'", !!r.error && sheetRows("access_log").some((x) => x[1] === OWNER && x[2] === "login_fail"));
  for (let i = 0; i < 4; i++) call("login", { email: OWNER, password: "matkhau-sai-2" });
  r = call("login", { email: OWNER, password: PW });
  check("sai 5 lần → khoá, mật khẩu đúng cũng không vào được", /15 phút/.test(r.error), r);
  clearFail(OWNER);
  const tempUntil = tempPassword_("hethan@gmail.com");
  check("mật khẩu của email đã hết quyền không vào được", !!call("login", { email: "hethan@gmail.com", password: tempUntil }).error);
  M.props.delete("pw:hethan@gmail.com");
  const TEMP2 = tempPassword_(OWNER), recTemp = PWREC(OWNER);
  recTemp.t = Date.now() - 1000; M.props.set("pw:" + OWNER, JSON.stringify(recTemp));
  check("mật khẩu tạm quá hạn → không vào được", !!call("login", { email: OWNER, password: TEMP2 }).error);
  clearFail(OWNER); M.props.delete("pw:" + OWNER);
  check("không còn gửi email", M.mails.length === 0);
  [...M.props.keys()].filter((k) => k.startsWith("sess:")).forEach((k) => M.props.delete(k));
  const login = (email) => { const rec = PWREC(email); if (!rec || rec.t) setPassword_(email, PW); return call("login", { email, password: PW }).data; };
  const admin = login(OWNER);
  check("đăng nhập đúng mật khẩu → có token + role admin", admin && admin.token && admin.token.length === 64 && admin.role === "admin");
  check("token chỉ lưu dạng băm (không nằm trong cache/properties)",
    ![...M.cache.keys(), ...M.props.keys(), ...M.props.values()].some((k) => k.includes(admin.token)));
  const sessKeys = () => [...M.props.keys()].filter((k) => k.startsWith("sess:"));
  check("phiên lưu ở Script Properties, hạn ~7 ngày", sessKeys().length === 1
    && Math.abs(JSON.parse(M.props.get(sessKeys()[0])).x - Date.now() - 7 * 864e5) < 60e3);

  // ---- Phiên + quyền ----
  r = call("snapshot");
  check("không token → lỗi AUTH", r.code === "AUTH");
  r = call("snapshot", { token: "abc" });
  check("token bịa → lỗi AUTH", r.code === "AUTH");
  r = call("snapshot", { token: admin.token });
  check("admin đọc snapshot (chưa có WM+)", r.ok && r.data.wm.length === 0 && r.data.wmVersion === "chưa có");
  r = gasCall("{không phải json");
  check("body không phải JSON → lỗi, không crash", !!r.error);
  r = call("xoaHet", { token: admin.token });
  check("thao tác lạ → lỗi", !!r.error);

  r = call("addUser", { token: admin.token, email: "Viewer@Gmail.com", role: "viewer" });
  check("admin cấp quyền viewer", r.ok);
  check("cấp quyền trả mật khẩu tạm, người mới phải đổi", r.data.tempPassword && PWREC("viewer@gmail.com").t > Date.now()
    && call("login", { email: "viewer@gmail.com", password: r.data.tempPassword }).data.mustChange === true);
  r = call("addUser", { token: admin.token, email: "viewer@gmail.com", role: "viewer" });
  check("cấp trùng email → lỗi", /đã có/.test(r.error));
  r = call("addUser", { token: admin.token, email: "x@gmail.com", role: "superadmin" });
  check("quyền bịa → lỗi", !!r.error);
  let viewer = login("viewer@gmail.com");
  check("viewer đăng nhập", viewer && viewer.role === "viewer");
  const v2 = login("viewer@gmail.com");
  r = call("changePassword", { email: "viewer@gmail.com", password: PW, newPassword: "viewer-pw-moi" });
  check("đổi mật khẩu đăng xuất các phiên cũ", r.ok && call("me", { token: v2.token }).code === "AUTH", r);
  r = call("resetPassword", { token: admin.token, email: OWNER });
  check("Admin không tự cấp lại cho chính mình", /Đổi mật khẩu/.test(r.error), r);
  const v3 = call("login", { email: "viewer@gmail.com", password: "viewer-pw-moi" }).data;
  r = call("resetPassword", { token: admin.token, email: "viewer@gmail.com" });
  check("Admin cấp lại mật khẩu: có mật khẩu tạm, phiên cũ bị huỷ, mật khẩu cũ hết hiệu lực", r.ok && r.data.tempPassword && call("me", { token: v3.token }).code === "AUTH"
    && !!call("login", { email: "viewer@gmail.com", password: "viewer-pw-moi" }).error, r);
  clearFail("viewer@gmail.com");
  viewer = login("viewer@gmail.com");
  for (const a of ["listUsers", "accessLog", "versions", "publishWm", "publishPrices", "priceConfig", "savePriceConfig", "priceTest", "priceStart", "priceStep", "priceFinish", "priceCancel", "botStatus", "saveBotKey", "askBot", "setSetting", "addUser", "removeUser", "resetPassword"]) {
    r = call(a, { token: viewer.token, email: "a@b.co", role: "admin", rows: [], key: "viewer_can_export", value: false });
    check(`viewer KHÔNG gọi được ${a}`, /Chỉ Admin/.test(r.error), r);
  }
  check("viewer đọc settings", call("settings", { token: viewer.token }).data.viewer_can_export === true);
  r = call("setSetting", { token: admin.token, key: "SYNC_SECRET", value: "x" });
  check("setSetting key lạ → lỗi", !!r.error);
  call("setSetting", { token: admin.token, key: "viewer_can_export", value: false });
  check("admin tắt Viewer xuất CSV", call("settings", { token: viewer.token }).data.viewer_can_export === false);

  // ---- Upload WM+ ----
  const W1 = [{ ma: "S1", ten: "a", tinh: "T", lat: 20.8, lng: 106.2 }, { ma: "S2", ten: "b", tinh: "T", lat: 20.9, lng: 106.3 }];
  const W2 = [{ ma: "S1", ten: "a", tinh: "T", lat: 20.801, lng: 106.2 }, { ma: "S3", tinh: "T", lat: 21.0, lng: 106.0 }];
  r = call("publishWm", { token: admin.token, rows: [{ ma: "D", lat: 20.8, lng: 106.2 }, { ma: "D", lat: 20.8, lng: 106.2 }] });
  check("upload trùng mã → lỗi, không tạo file", /Trùng mã/.test(r.error) && Object.keys(M.files).length === 0);
  r = call("publishWm", { token: admin.token, rows: [{ ma: "B", lat: 0, lng: 0 }] });
  check("upload toạ độ ngoài VN → lỗi", /ngoài lãnh thổ/.test(r.error));
  r = call("publishWm", { token: admin.token, rows: [] });
  check("upload rỗng → lỗi", !!r.error);
  r = call("publishWm", { token: admin.token, rows: W1 });
  check("upload lần 1: v1, 2 dòng, thêm 2", r.ok && r.data.version === "v1" && r.data.rows === 2 && r.data.added === 2, r);
  r = call("publishWm", { token: admin.token, rows: W2 });
  check("upload lần 2: thêm 1 · bỏ 1 · dời 1", r.ok && r.data.added === 1 && r.data.removed === 1 && r.data.moved === 1, r);
  check("mỗi lần upload = 1 file Sheet riêng", Object.keys(M.files).length === 2);
  r = call("snapshot", { token: viewer.token });
  check("viewer thấy WM+ bản mới nhất (S1, S3) + hạn xoá", r.ok && r.data.wm.map((w) => w.ma).sort().join() === "S1,S3" && !!r.data.wmExpires);
  check("thiếu tên → dùng mã làm tên", r.data.wm.find((w) => w.ma === "S3").ten === "S3");
  check("thiếu chuỗi → mặc định WM+", r.data.wm.every((w) => w.chuoi === "WM+" && w.khu_vuc === ""));
  r = call("publishWm", { token: admin.token, rows: [{ ma: "X", lat: 20.8, lng: 106.2, chuoi: "BHX" }] });
  check("chuỗi lạ → lỗi", /chuỗi/.test(r.error));

  // ---- Hết hạn 48 giờ ----
  const vs = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("wm_versions");
  vs.data[2][2] = new Date(Date.now() - 49 * 3600e3).toISOString();      // v2 upload 49 giờ trước
  vs.data[1][2] = new Date(Date.now() - 47 * 3600e3).toISOString();      // v1: 47 giờ (nhưng không còn là bản hiện hành)
  r = call("snapshot", { token: admin.token });
  check("quá 48h: snapshot KHÔNG trả WM+ ngay (chưa cần chờ job xoá)", r.ok && r.data.wm.length === 0);
  purgeExpiredWm();
  const v2file = vs.data[2][4], v1file = vs.data[1][4];
  check("job xoá: file v2 bị xoá VĨNH VIỄN (Drive.Files.remove)", M.removed.includes(v2file) && !M.files[v2file]);
  check("job xoá: KHÔNG đụng file v1 còn hạn", !!M.files[v1file]);
  check("job xoá: ghi purged_at cho v2", !!vs.data[2][10]);
  r = call("versions", { token: admin.token });
  check("lịch sử phiên bản: v2 'Đã xoá', v1 'Còn hạn'", r.data[0].status.startsWith("Đã xoá") && r.data[1].status.startsWith("Còn hạn"), r.data);
  vs.data[1][2] = new Date(Date.now() - 50 * 3600e3).toISOString();
  M.driveRemoveFails = true; purgeExpiredWm(); M.driveRemoveFails = false;
  check("Drive API chưa bật → chuyển vào thùng rác + ghi chú cảnh báo", M.trashed.includes(v1file) && /thùng rác/.test(vs.data[1][11]));
  purgeExpiredWm();
  check("chạy job lần nữa: không xoá lại bản đã xoá", M.removed.length === 1);
  r = call("publishWm", { token: admin.token, rows: W2.concat([{ ma: "T1", tinh: "T", lat: 20.7, lng: 106.1, chuoi: "WMT", khu_vuc: "Rural", dia_chi: "12 Lê Lợi", vung: "Vùng 2", mien: "Miền Bắc", quan: "Quận Ba", phuong: "Phường Bốn" }]) });
  const t1 = call("snapshot", { token: admin.token }).data.wm.find((w) => w.ma === "T1");
  check("lưu & đọc lại Chuỗi/Khu vực/Địa chỉ/Vùng/Miền/Quận/Phường", r.ok && t1 && t1.chuoi === "WMT" && t1.khu_vuc === "Rural" && t1.dia_chi === "12 Lê Lợi" && t1.vung === "Vùng 2" && t1.mien === "Miền Bắc" && t1.quan === "Quận Ba" && t1.phuong === "Phường Bốn", t1);
  // Đường đi thực tế: Google giả đảo ngược các điểm giữa đường
  M.mapsLog = [];
  M.directions = (q) => ({ status: "OK", routes: [{ waypoint_order: q.waypoints.map((_, k) => q.waypoints.length - 1 - k),
    legs: Array.from({ length: q.waypoints.length + 1 }, () => ({ distance: { value: 2500 }, duration: { value: 300 } })), overview_polyline: { points: "abc" } }] });
  const rp = (n) => Array.from({ length: n }, (_, k) => ({ lat: 21 + k * 0.01, lng: 105.8 }));
  check("route: chưa đăng nhập thì bị từ chối, không gọi Google", call("route", { points: rp(3) }).code === "AUTH" && M.mapsLog.length === 0);
  r = call("route", { token: viewer.token, points: rp(5) });
  check("route: viewer dùng được; 1 chặng, điểm cuối giữ nguyên, đúng thứ tự Google trả", r.ok && r.data.order.join() === "2,1,0,3" && r.data.legs.length === 4 && r.data.legs[0].km === 2.5 && r.data.legs[0].min === 5 && M.mapsLog.length === 1 && M.mapsLog[0].optimize === true, r);
  M.mapsLog = [];
  r = call("route", { token: viewer.token, points: rp(31) });
  check("route: 30 điểm chia 2 chặng, chặng sau đi tiếp từ điểm cuối chặng trước, đủ mọi điểm", r.ok && M.mapsLog.length === 2 && M.mapsLog[1].origin[0] === 21 + 24 * 0.01 && new Set(r.data.order).size === 30 && r.data.legs.length === 30 && r.data.polys.length === 2, r);
  check("route: từ chối quá nhiều điểm hoặc toạ độ ngoài VN, không gọi Google", !call("route", { token: viewer.token, points: rp(52) }).ok && !call("route", { token: viewer.token, points: [{ lat: 1, lng: 1 }, { lat: 21, lng: 105 }] }).ok && M.mapsLog.length === 2);
  M.directions = () => ({ status: "ZERO_RESULTS", routes: [] });
  r = call("route", { token: viewer.token, points: rp(3) });
  check("route: Google không tìm được đường thì báo lỗi rõ", !r.ok && /ZERO_RESULTS/.test(r.error), r);
  check("boot: chưa đăng nhập thì bị từ chối", call("boot").code === "AUTH");
  r = call("boot", { token: admin.token });
  check("boot: 1 lần gọi trả đủ người dùng, cài đặt, dữ liệu, thay đổi", r.ok && r.data.me.role === "admin" && r.data.settings.viewer_can_export !== undefined && r.data.snapshot.wm.some((w) => w.ma === "T1") && Array.isArray(r.data.changes), r);

  // ---- Đồng bộ BHX ----
  const snap = (...s) => s.map(([id, lat, lng]) => ({ store_id: id, dia_chi: "BHX " + id, province_id: 1000, tinh: "Hà Nội", lat, lng }));
  const S0 = snap(...Array.from({ length: 10 }, (_, i) => [i + 1, 21 + (i + 1) / 1000, 105.8]));
  r = call("syncBhx", { secret: "sai", stores: S0 });
  check("sai SYNC_SECRET → lỗi", /SYNC_SECRET/.test(r.error));
  r = call("syncBhx", { secret: SECRET, stores: S0 });
  check("lần đầu = baseline, 0 thay đổi", r.ok && r.data.baseline === true && sheetRows("bhx_changes").length === 0, r);
  const S1 = snap([1, 21.002, 105.8], [2, 21.0021, 105.8], ...Array.from({ length: 7 }, (_, i) => [i + 3, 21 + (i + 3) / 1000, 105.8]), [11, 21.5, 105.9]);
  r = call("syncBhx", { secret: SECRET, stores: S1, dryRun: true });
  check("dry-run: mở 1 · đóng 1 · dời 1, không ghi", r.data.open === 1 && r.data.close === 1 && r.data.move === 1 && sheetRows("bhx_changes").length === 0, r);
  r = call("syncBhx", { secret: SECRET, stores: S1 });
  check("ngày 2: mở 1 · đóng 1 · dời 1 (dời 11 m không tính)", r.data.open === 1 && r.data.close === 1 && r.data.move === 1, r);
  r = call("changes", { token: viewer.token });
  check("viewer thấy 3 thay đổi đúng loại", r.data.length === 3 && ["open:11", "close:10", "move:1"].every((k) => r.data.some((c) => c.type + ":" + c.ma === k)), r.data);
  check("bản ghi 'dời' giữ toạ độ cũ", r.data.find((c) => c.type === "move").old_lat === 21.001);
  r = call("snapshot", { token: viewer.token });
  check("snapshot chỉ trả BHX đang mở (10)", r.data.bhx.length === 10 && !r.data.bhx.some((b) => b.ma === 10));
  check("ghi giờ cập nhật BHX", /^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(r.data.bhxUpdated));
  const S2 = snap([1, 21.002, 105.8], [2, 21.0021, 105.8], ...Array.from({ length: 8 }, (_, i) => [i + 3, 21 + (i + 3) / 1000, 105.8]), [11, 21.5, 105.9]);
  r = call("syncBhx", { secret: SECRET, stores: S2 });
  check("ngày 3: cửa hàng mở lại tính 'mở mới'", r.data.open === 1 && r.data.close === 0, r);
  const before = JSON.stringify(sheetRows("bhx_stores"));
  r = call("syncBhx", { secret: SECRET, stores: snap([1, 21.002, 105.8], [2, 21.0021, 105.8], [3, 21.003, 105.8]) });
  check("guard: API trả thiếu (>30% bị coi là đóng) → lỗi, không ghi", /Guard/.test(r.error) && JSON.stringify(sheetRows("bhx_stores")) === before);
  r = call("syncBhx", { secret: SECRET, stores: [{ store_id: "x", lat: "a" }] });
  check("snapshot sai định dạng → lỗi", !!r.error);

  const priceApi = (url, opts) => {

  check("thiếu vài mục token vẫn chạy, không gửi header rỗng", r.ok && r.data[0].ok && !("devicetoken" in priceCalls[nOk].h) && !("accesstoken" in priceCalls[nOk].h) && priceCalls[nOk].h.xapikey === "TOKEN-THAT-BHX_XAPIKEY", r);
  SECRET_NAMES.forEach((k) => M.props.delete(k));
  const nNo = priceCalls.length; r = adm("priceTest");
  check("không có token nào vẫn thử được như khách", r.ok && r.data[0].ok && !("authorization" in priceCalls[nNo].h) && priceCalls[nNo].h.xapikey === "bhx-api-core-2022", r);
  const apiOld = M.fetchHandler;

  M.fetchHandler = apiOld;

  check("gửi đúng token và mã cửa hàng của từng tỉnh", priceCalls[0].h.accesstoken === "TOKEN-THAT-BHX_ACCESSTOKEN" && priceCalls[0].b.storeId === 1111 && priceCalls[priceCalls.length - 1].b.storeId === 2222);
  const runsBefore = sheetRows("price_runs").length, itemsB4 = sheetRows("price_items").length;

  check("thông báo lỗi không chứa token", !JSON.stringify(r).includes("TOKEN-THAT"));
  const calls401 = priceCalls.length;

  job = adm("priceStart").data;
  check("bấm lại: tiếp tục đúng lần cũ, không bắt đầu lại", job.status === "running" && job.done === 0, job);

  priceMode = "ok";
  job = adm("priceStart").data;
  r = adm("priceStep", { jobId: job.id });
  let guard = 0;
  while (r.ok && r.data.status === "running" && guard++ < 50) r = adm("priceStep", { jobId: job.id });

  check("SKU không bị trùng khi tiếp tục sau lỗi", sheetRows("price_tmp").length === 52, sheetRows("price_tmp").length);
  r = adm("priceStep", { jobId: job.id });
  check("ghi xong: có 2 tỉnh mới, lần tải có đánh dấu cập nhật trực tiếp", r.ok && r.data.status === "done" && r.data.summary.provinces.length === 2 && sheetRows("price_tmp").length === 0 && sheetRows("price_runs").length === runsBefore + 2, r);
  r = adm("priceStep", { jobId: job.id });
  check("gọi thêm sau khi xong: không chạy lại", r.ok && r.data.status === "done");
  r = call("prices", { token: viewer.token });
  const hcmRow = r.data.items.find((x) => x.tinh === "Hồ Chí Minh" && x.final === 8011);
  check("viewer xem được giá vừa cập nhật, có tính giảm giá", !!hcmRow && Math.abs(hcmRow.off - 0.1989) < 0.001 && hcmRow.promo === true, hcmRow);
  check("không gọi BHX khi chỉ xem báo cáo", (() => { const n = priceCalls.length; call("prices", { token: viewer.token }); return priceCalls.length === n; })());
  priceMode = "none";
  job = adm("priceStart").data;
  r = adm("priceStep", { jobId: job.id });
  guard = 0; while (r.ok && r.data.status === "running" && guard++ < 50) r = adm("priceStep", { jobId: job.id });
  check("BHX không trả SKU nào: không xoá dữ liệu cũ, báo kiểm tra mã", r.ok && r.data.status === "paused" && /không trả SKU/.test(r.data.msg) && sheetRows("price_runs").length === runsBefore + 2, r);
  r = adm("savePriceConfig", { provinces: CFG3 });
  check("đang có lần dở dang: không đổi được thiết lập", /dở dang/.test(r.error), r);
  r = adm("priceCancel");
  check("huỷ: xoá lần dở dang", r.ok && r.data.job === null && !sheetRows("price_tmp").length, r);
  check("không có lịch tự chạy lấy giá", M.triggers.length === before3 && !M.triggers.some((t) => /price/i.test(t.getHandlerFunction())));
  SECRET_NAMES.forEach((k) => M.props.delete(k));

  // ---- Bot Gemini ----
  const BOT_CTX = { pham_vi: { tinh: "Hà Nội" }, chi_so: { so_sku: 5 } };
  r = adm("botStatus");
  check("chưa có key: báo chưa có, không lộ gì", r.ok && r.data.hasKey === false && r.data.used === 0, r);
  r = adm("askBot", { question: "x", context: BOT_CTX });
  check("chưa có key: không gọi được", /GEMINI_API_KEY/.test(r.error), r);
  r = adm("saveBotKey", { key: "ngan" });
  check("key sai dạng: báo lỗi, không lưu", /không đúng dạng/.test(r.error) && !M.props.has("GEMINI_API_KEY"), r);
  r = adm("saveBotKey", { key: "co dau cach o giua key nay dai du" });
  check("key có dấu cách ở giữa: báo lỗi", /không đúng dạng/.test(r.error), r);
  const K20 = "AIzaKHOA-DAN-TREN-WEB-1234567890";
  r = adm("saveBotKey", { key: "  " + K20 + "\n" });
  check("Admin dán key: lưu vào Script Properties, bỏ khoảng trắng, không trả lại key", r.ok && r.data.hasKey === true && M.props.get("GEMINI_API_KEY") === K20 && !JSON.stringify(r).includes(K20), r);
  check("nhật ký chỉ ghi có lưu key, không ghi giá trị", sheetRows("access_log").some((x) => x[2] === "bot_key") && !sheetRows("access_log").flat().some((v) => String(v).includes(K20)));
  M.props.set("GEMINI_API_KEY", "KHOA-THAT");
  check("trạng thái không chứa key", !JSON.stringify(adm("botStatus")).includes("KHOA-THAT"));
  let botReq = null, botMode = "ok";
  const gErr = (http, code, message) => ({ code: http, body: { error: { code, message } } });
  M.fetchHandler = (url, opts) => {
    botReq = { url, h: opts.headers, b: JSON.parse(opts.payload) };
    if (botMode === "401") return gErr(401, "authentication", "KHOA-THAT sai");
    if (botMode === "429") return gErr(429, "rate_limit_exceeded", "slow");
    if (botMode === "quota") return gErr(429, "quota_exceeded", "day");
    if (botMode === "403") return gErr(403, "permission_denied", "free tier not available");
    if (botMode === "bad") return gErr(400, "invalid_request", "field KHOA-THAT bad");
    if (botMode === "model") return gErr(404, "model_not_found", "x");
    if (botMode === "503") return gErr(503, "service_unavailable", "x");
    if (botMode === "safety") return gErr(400, "safety", "blocked");
    if (botMode === "net") throw new Error("Address unavailable KHOA-THAT");
    if (botMode === "empty") return { code: 200, body: { steps: [{ type: "thought", content: [{ text: "suy" }] }] } };
    if (botMode === "steps") return { code: 200, body: { steps: [{ type: "user_input", content: [{ text: "hỏi" }] }, { type: "thought", content: [{ text: "suy" }] }, { type: "model_output", content: [{ type: "text", text: "Từ steps" }] }] } };
    return { code: 200, body: { output_text: "Nhận định" } };
  };
  r = adm("askBot", { question: "Tóm tắt", context: BOT_CTX, history: [{ q: "a", a: "b" }] });
  check("hỏi được, không trả key", r.ok && r.data.text === "Nhận định" && r.data.used === 1 && !JSON.stringify(r).includes("KHOA-THAT"), r);
  check("gọi đúng API Gemini, key nằm ở header, không nằm trong URL", /generativelanguage\.googleapis\.com\/v1beta\/interactions$/.test(botReq.url) && botReq.h["x-goog-api-key"] === "KHOA-THAT" && !botReq.url.includes("KHOA-THAT") && botReq.b.model === "gemini-3.5-flash-lite" && !JSON.stringify(botReq.b).includes("KHOA-THAT"));
  check("không lưu hội thoại phía Google, đúng mức suy luận", botReq.b.store === false && botReq.b.generation_config.thinking_level === "medium" && botReq.b.generation_config.max_output_tokens === 8000);
  check("số liệu nằm trong thẻ data, kèm câu trước", /<data>/.test(botReq.b.input) && /Tóm tắt/.test(botReq.b.input) && /<cau_truoc>/.test(botReq.b.input));
  botMode = "steps"; r = adm("askBot", { question: "x", context: BOT_CTX });
  check("không có output_text: lấy chữ ở bước cuối, bỏ phần suy luận", r.ok && r.data.text === "Từ steps", r);
  const fails = [["401", /API key không hợp lệ/, "key sai"], ["429", /gọi quá nhanh/, "gọi quá nhanh"], ["quota", /hết hạn mức/, "hết hạn mức miễn phí"], ["403", /free tier not available/, "403 hiện lý do"], ["bad", /field/, "400 hiện lý do"], ["model", /gemini-3\.5-flash-lite/, "sai model"], ["503", /quá tải/, "quá tải"], ["safety", /chặn/, "bị chặn"], ["net", /chưa gọi được Gemini.*Address unavailable/, "lỗi mạng"], ["empty", /không trả về nội dung/, "không có chữ"]];
  const usedB4 = adm("botStatus").data.used;
  fails.forEach(([m, re, name]) => { botMode = m; const x = adm("askBot", { question: "x", context: BOT_CTX }); check("lỗi " + name + ": báo đúng, che key", re.test(x.error) && !JSON.stringify(x).includes("KHOA-THAT"), x); });
  check("lỗi không tính lượt hỏi", adm("botStatus").data.used === usedB4);
  botMode = "ok";
  r = adm("askBot", { question: "x", context: { pham_vi: {}, danh_sach_wm: [{ ma: "S1" }] } });
  check("số liệu có nhóm lạ (vd danh sách WM) → chặn, không gọi Gemini", /không được phép gửi/.test(r.error), r);
  r = adm("askBot", { question: "x".repeat(1001), context: BOT_CTX });
  check("câu hỏi quá dài → lỗi", /dài quá/.test(r.error), r);
  M.props.set("GEMINI_API_KEY", "  KHOA-THAT\n");
  r = adm("askBot", { question: "x", context: BOT_CTX });
  check("key dán thừa dấu cách vẫn dùng được", r.ok && botReq.h["x-goog-api-key"] === "KHOA-THAT", r);
  M.props.set("GEMINI_API_KEY", "KHOA-THAT");
  check("nhật ký không ghi nội dung câu hỏi", sheetRows("access_log").some((x) => x[2] === "bot") && !sheetRows("access_log").flat().some((v) => /Tóm tắt/.test(String(v))));
  M.props.set("bot_used:" + Utilities.formatDate(new Date(), "Asia/Ho_Chi_Minh", "yyyy-MM-dd"), "30");
  r = adm("askBot", { question: "x", context: BOT_CTX });
  check("hết lượt trong ngày: không gọi Gemini", /hết 30 lượt/.test(r.error), r);
  M.props.delete("GEMINI_API_KEY");

  // ---- Thu hồi quyền, nhật ký, đăng xuất ----
  r = call("removeUser", { token: admin.token, email: OWNER });
  check("admin KHÔNG tự thu hồi mình", /chính mình/.test(r.error));

  check("viewer bị thu hồi → token mất hiệu lực NGAY", r.code === "AUTH");
  r = call("accessLog", { token: admin.token });
  const ev = r.data.map((x) => x.event + ":" + x.email);
  check("nhật ký có login + denied", ev.includes("login:" + OWNER) && ev.includes("denied:la@gmail.com"), ev);
  check("nhật ký mới nhất ở trên", r.data[0].at >= r.data[r.data.length - 1].at);
  check("viewer bị thu hồi → phiên bị xoá khỏi Properties", !M.props.has("sess:" + sha_(viewer.token)));
  // phiên 7 ngày cố định: dùng không gia hạn, phiên cũ 30 ngày rút về 7 ngày, hết hạn thì bị từ chối + dọn
  const k0 = "sess:" + sha_(admin.token), s0 = JSON.parse(M.props.get(k0));
  M.props.set(k0, JSON.stringify({ ...s0, x: Date.now() + 2 * 864e5 }));          // giả: còn 2 ngày
  call("snapshot", { token: admin.token });
  check("dùng web khi phiên còn ít ngày → không tự gia hạn", JSON.parse(M.props.get(k0)).x - Date.now() < 2 * 864e5 + 60e3);
  M.props.set(k0, JSON.stringify({ ...s0, x: Date.now() + 25 * 864e5 }));         // giả: phiên cũ theo hạn 30 ngày

  const tmp = login(OWNER), k1 = "sess:" + sha_(tmp.token);
  M.props.set(k1, JSON.stringify({ e: OWNER, x: Date.now() - 1000 }));              // giả: đã quá hạn
  check("phiên quá hạn → lỗi AUTH", call("snapshot", { token: tmp.token }).code === "AUTH");
  check("phiên quá hạn → bị xoá khi dùng", !M.props.has(k1));

  call("logout", { token: admin.token });
  check("đăng xuất → token hết hiệu lực", call("snapshot", { token: admin.token }).code === "AUTH");
  check("đăng xuất → phiên bị xoá khỏi Properties", !M.props.has(k0));
  check("doGet không trả dữ liệu", JSON.parse(doGet().getContent()).service === "wm-bhx");

  out.innerHTML += `\nKẾT QUẢ: ${fail ? fail + " lỗi" : "TẤT CẢ ĐẠT"} (${pass}/${pass + fail})`;
  document.title = fail ? "FAIL" : "PASS";
  window.__result = { pass, fail };
})().catch((e) => { document.getElementById("out").innerHTML += `<span class="fail">LỖI CHẠY TEST: ${e.stack}</span>`; window.__result = { error: String(e) }; });
</script>
