<!doctype html>
<meta charset="utf-8">
<title>Test nearby.js</title>
<pre id="out"></pre>
<script src="../../web/nearby.js"></script>
<script>
// So web/nearby.js với cách đo tới mọi điểm (chép nguyên từ computeAll cũ trong app.js). Toàn bộ là dữ liệu giả.
const R_KM = 6371.0088, rad = Math.PI / 180;
function haversine(la1, lo1, cla1, la2, lo2, cla2) {
  const a = Math.sin((la2 - la1) / 2) ** 2 + cla1 * cla2 * Math.sin((lo2 - lo1) / 2) ** 2;
  return 2 * R_KM * Math.asin(Math.sqrt(a));
}
function brute(wm, bhx, K, Rcalc) {
  const n = wm.length, m = bhx.length, bLa = new Float64Array(m), bLo = new Float64Array(m), bC = new Float64Array(m);
  for (let j = 0; j < m; j++) { bLa[j] = bhx[j].lat * rad; bLo[j] = bhx[j].lng * rad; bC[j] = Math.cos(bLa[j]); }
  const near = new Float64Array(n), nearIdx = new Int32Array(n), pairsBy = [], topBy = [], sortAll = K > 50;
  for (let i = 0; i < n; i++) {
    const la = wm[i].lat * rad, lo = wm[i].lng * rad, c = Math.cos(la), list = [], top = [];
    let best = Infinity, bi = -1;
    for (let j = 0; j < m; j++) {
      const d = haversine(la, lo, c, bLa[j], bLo[j], bC[j]);
      if (d < best) { best = d; bi = j; }
      if (d <= Rcalc) list.push([j, Math.round(d * 1000) / 1000]);
      if (sortAll) top.push([j, d]);
      else if (top.length < K || d < top[top.length - 1][1]) {
        let k = top.length; while (k > 0 && top[k - 1][1] > d) k--;
        top.splice(k, 0, [j, d]); if (top.length > K) top.pop();
      }
    }
    list.sort((a, b) => a[1] - b[1]);
    if (sortAll) top.sort((a, b) => a[1] - b[1]);
    near[i] = Math.round(best * 1000) / 1000; nearIdx[i] = bi; pairsBy.push(list);
    topBy.push(top.slice(0, K).map(([j, d]) => [j, Math.round(d * 1000) / 1000]));
  }
  return { near, nearIdx, pairsBy, topBy };
}
const same = (a, b) => JSON.stringify([[...a.near].map(String), [...a.nearIdx], a.pairsBy, a.topBy]) === JSON.stringify([[...b.near].map(String), [...b.nearIdx], b.pairsBy, b.topBy]);

let seed = 12345; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const round6 = (x) => +x.toFixed(6);
const cluster = (n, lat, lng, sd) => Array.from({ length: n }, () => ({ lat: round6(lat + (rnd() - 0.5) * sd), lng: round6(lng + (rnd() - 0.5) * sd) }));
const north = (n) => cluster(n, 21, 105.9, 1.5), south = (n) => cluster(n, 10.8, 106.7, 1.5), country = (n) => Array.from({ length: n }, () => ({ lat: round6(8.5 + rnd() * 15), lng: round6(102.5 + rnd() * 7) }));
const dup = (a) => a.concat(a.slice(0, Math.floor(a.length / 2)));                 // trùng toạ độ → trùng khoảng cách
const onGrid = (n) => Array.from({ length: n }, () => ({ lat: 20 + Math.floor(rnd() * 40) * 0.05, lng: 105 + Math.floor(rnd() * 40) * 0.05 }));   // nằm đúng mép ô

const cases = [
  ["2 cụm, nhiều điểm", north(300).concat(south(200)), dup(north(800).concat(south(800)))],
  ["WM miền Bắc, đối thủ chỉ ở miền Nam (rất xa)", north(120), south(400)],
  ["đối thủ rất ít", country(200), country(16)],
  ["1 đối thủ", country(30), country(1)],
  ["không có đối thủ", country(10), []],
  ["không có WM", [], country(50)],
  ["rải khắp nước, thưa", country(200), country(500)],
  ["toạ độ nằm đúng mép ô", onGrid(200), onGrid(600)],
  ["trùng hệt toạ độ", [{ lat: 21, lng: 105.8 }, { lat: 21, lng: 105.8 }], [{ lat: 21, lng: 105.8 }, { lat: 21, lng: 105.8 }, { lat: 21.001, lng: 105.8 }]],
  ["dày đặc trong 1 thành phố", cluster(200, 10.78, 106.7, 0.2), dup(cluster(1500, 10.78, 106.7, 0.3))],
];
const params = [[10, 5], [10, 30], [1, 5], [5, 12], [60, 5], [1000, 8]];
let ok = 0, bad = 0; const lines = [];
for (const [name, w, b] of cases) for (const [K, Rc] of params) {
  const pass = same(brute(w, b, K, Rc), Nearby.matrix(w, b, K, Rc));
  pass ? ok++ : (bad++, lines.push(`[FAIL] ${name} K=${K} R=${Rc}`));
}
// Tìm WM gần nhất cho từng đối thủ, và đếm trong 2 km — hai chỗ còn lại dùng search.
const W = dup(north(400)), B = country(800), ix = Nearby.index(W);
let okN = true;
B.forEach((q) => {
  const la = q.lat * rad, lo = q.lng * rad, c = Math.cos(la); let best = Infinity, bi = -1, n2 = 0;
  W.forEach((w, k) => { const d = haversine(la, lo, c, w.lat * rad, w.lng * rad, Math.cos(w.lat * rad)); if (d <= 2) n2++; if (d < best) { best = d; bi = k; } });
  const a = Nearby.search(ix, q.lat, q.lng, 1, 2), n2b = a.filter((x) => x[1] <= 2).length;
  if (a[0][0] !== bi || a[0][1] !== best || n2b !== n2) okN = false;
});
okN ? ok++ : (bad++, lines.push("[FAIL] gần nhất / đếm trong 2 km"));
// Lập tuyến: so với thử mọi thứ tự (ít điểm); nhiều điểm thì đúng là một hoán vị và không dài hơn đi theo thứ tự ban đầu
const pathKm = (s, pts, ord) => { const dist = (a, b) => { const la = a.lat * rad, lb = b.lat * rad; return haversine(la, a.lng * rad, Math.cos(la), lb, b.lng * rad, Math.cos(lb)); }; let t = 0, p = s; for (const k of ord) { t += dist(p, pts[k]); p = pts[k]; } return t; };
const perms = (n) => { const out = [], a = Array.from({ length: n }, (_, k) => k); const go = (i) => { if (i === n) { out.push(a.slice()); return; } for (let j = i; j < n; j++) { [a[i], a[j]] = [a[j], a[i]]; go(i + 1); [a[i], a[j]] = [a[j], a[i]]; } }; go(0); return out; };
let okR = true;
for (let t = 0; t < 40; t++) {
  const n = 1 + t % 8, pts = country(n), s = country(1)[0], r = Nearby.route(s, pts);
  const best = Math.min(...perms(n).map((o) => pathKm(s, pts, o)));
  if (Math.abs(r.total - best) > 1e-6 || new Set(r.order).size !== n || !r.exact) okR = false;
}
okR ? ok++ : (bad++, lines.push("[FAIL] tuyến ít điểm chưa ngắn nhất"));
const asc = (n) => Array.from({ length: n }, (_, k) => k);
let okH = true, ratio = 0;
for (const n of [13, 20, 50, 200]) {
  const pts = n > 100 ? cluster(n, 21, 105.8, 0.5) : country(n), s = pts[0], r = Nearby.route(s, pts);
  if (new Set(r.order).size !== n || r.exact || r.total > pathKm(s, pts, asc(n)) + 1e-6) okH = false;
  if (Math.abs(r.total - pathKm(s, pts, r.order)) > 1e-6) okH = false;
}
// Tuyến 13 điểm so với lời giải chính xác: thêm 1 điểm trùng điểm xuất phát thì đáp án chính xác 12 điểm vẫn đúng
for (let t = 0; t < 30; t++) {
  const pts = cluster(12, 21, 105.8, 1), s = { lat: 21, lng: 105.8 }, exact = Nearby.route(s, pts), h = Nearby.route(s, pts.concat([{ ...s }]));
  ratio = Math.max(ratio, h.total / exact.total);
}
if (ratio > 1.05) okH = false;
okH ? ok++ : (bad++, lines.push("[FAIL] tuyến nhiều điểm"));
lines.push(`Tuyến nhiều điểm so với tối ưu: dài hơn tối đa ${((ratio - 1) * 100).toFixed(1)}%`);
lines.push(`${ok} đạt, ${bad} lỗi`);
const big = [north(3000).concat(south(1000)), dup(north(1700).concat(south(800)))];
let t = performance.now(); brute(big[0], big[1], 10, 5); const tOld = performance.now() - t;
t = performance.now(); Nearby.matrix(big[0], big[1], 10, 5); const tNew = performance.now() - t;
lines.push(`Tốc độ với ${big[0].length} WM × ${big[1].length} đối thủ: cũ ${Math.round(tOld)} ms, mới ${Math.round(tNew)} ms`);
document.getElementById("out").textContent = lines.join("\n");
document.title = bad ? "FAIL" : "PASS";
</script>
