localStorage.setItem("wmbhx_fb", "1"); localStorage.removeItem("wmbhx_price_job");
window.APP_CONFIG = { mode: "gas", gasUrl: "http://gas.test/exec" };
const store = new Map();
const docRef = (c, id) => ({ _k: c + "/" + id, id,
  async get() { const v = store.get(c + "/" + id); return { exists: !!v, id, data: () => v }; },
  async set(v, o) { store.set(c + "/" + id, o && o.merge ? { ...(store.get(c + "/" + id) || {}), ...v } : v); },
  async delete() { store.delete(c + "/" + id); } });

const fbUser = { email: "admin@gmail.com", emailVerified: true, getIdToken: async () => "eyJ.tok", getIdTokenResult: async () => ({ authTime: new Date(window.__authTime || Date.now()).toUTCString() }), sendEmailVerification: async () => { window.__sent = true; } };

  async signInWithEmailAndPassword(e, p) { if (p !== "dung") { throw Object.assign(new Error("x"), { code: "auth/invalid-credential" }); } this.currentUser = e === "chuaxn@gmail.com" ? { ...fbUser, emailVerified: false } : fbUser; return { user: this.currentUser }; },
  async createUserWithEmailAndPassword() { this.currentUser = fbUser; return { user: fbUser }; }, async sendPasswordResetEmail(e) { window.__reset = e; } };
const Timestamp = { fromMillis: (ms) => ({ ms, toMillis: () => ms }) };
window.firebase = { initializeApp() {}, auth: Object.assign(() => fakeAuth, { EmailAuthProvider: { credential: () => ({}) } }),
  firestore: Object.assign(() => ({ collection: (c) => ({ doc: (id) => docRef(c, id), async get() { return { docs: [...store.entries()].filter(([k]) => k.startsWith(c + "/")).map(([k, v]) => ({ id: k.split("/")[1], data: () => v })) }; } }),
    batch: () => { const ops = []; return { set: (r, v, o) => ops.push(() => r.set(v, o)), delete: (r) => ops.push(() => r.delete()), async commit() { writes += ops.length; for (const f of ops) await f(); } }; } }), { Timestamp }) };
// Dữ liệu giả của Apps Script cho bản đồ. bigBhx: đủ lớn để phải chia nhiều phần.
let gasBoots = 0, wmExpMs = Date.now() + 40 * 36e5, bigBhx = false, meRole = "admin";
const fakeSnap = () => ({ wm: [{ ma: "W1", ten: "WM 1", tinh: "Hà Nội", lat: 21, lng: 105.8, chuoi: "WM+" }], wmVersion: "v1 — 10/11/2026", wmExpires: wmExpMs ? new Date(wmExpMs).toISOString() : null,
  bhx: Array.from({ length: bigBhx ? 9000 : 3 }, (_, i) => ({ ma: i, dia_chi: "Số " + i + " đường Nguyễn Văn Cừ, phường Bình Đông", tinh: "Hà Nội", lat: 21 + i / 1e5, lng: 105.8 })),
  comp: [{ chain: "Co.op Food", ma: "C1", ten: "C1", dia_chi: "x", tinh: "Hà Nội", lat: 21.01, lng: 105.81 }], compUpdated: "2026-11-11 06:10", compStatus: "{}", bhxUpdated: "2026-11-11 06:05" });
let bhxMode = "ok", priceBump = 0, bhxCalls = 0, sizesSeen = new Set();
const realFetch = window.fetch;
window.fetch = async (url, o) => {
  if (url === "http://gas.test/exec") { const b = JSON.parse(o.body); window.__gasToken = b.token; if (b.action === "boot") { gasBoots++; return new Response(JSON.stringify({ data: { me: { email: "admin@gmail.com", role: meRole }, settings: { viewer_can_export: false }, snapshot: fakeSnap(), changes: [{ date: "2026-11-10", chain: "BHX", type: "open", ma: "9", dia_chi: "y", tinh: "Hà Nội", lat: 21, lng: 105.8 }] } })); }
    if (b.action === "me") return new Response(JSON.stringify({ data: { email: "admin@gmail.com", role: meRole } }));
    if (b.action === "publishWm") return new Response(JSON.stringify({ data: { version: "v2", rows: b.rows.length, added: 0, removed: 0, moved: 0 } })); if (b.action === "listUsers") return new Response(JSON.stringify({ data: [{ email: "Viewer@gmail.com", role: "viewer" }] })); return new Response(JSON.stringify({ data: true })); }

    if (b.CategoryId !== 10338 && b.CategoryId !== 10340) return new Response(JSON.stringify({ data: { products: [] } }));
    const n = bhxMode === "few" ? (b.PageIndex ? 0 : 3) : b.PageIndex === 0 ? 50 : b.PageIndex === 1 ? 5 : 0;

  }

const realST = window.setTimeout; window.setTimeout = (f, ms, ...a) => realST(f, ms > 50 ? 0 : ms, ...a);   // bỏ thời gian chờ để test chạy nhanh

<script src="/web/firebase-api.js"></script>
<script>
(async () => {
  const out = document.getElementById("out"); let pass = 0, fail = 0;
  const check = (n, c, x) => { if (c) pass++; else fail++; out.textContent += `${c ? "[OK]  " : "[FAIL] "}${n}${c ? "" : " " + JSON.stringify(x)}\n`; };
  const A = window.GasAPI, err = async (f) => { try { await f(); return ""; } catch (e) { return e.message; } };
  check("bật chế độ Firebase khi có cờ", A.fb === true);
  let me = await A.currentUser();
  check("mở lại phiên: lấy được người dùng từ Apps Script, gửi token Firebase", me && me.role === "admin" && window.__gasToken === "eyJ.tok", me);
  window.__authTime = Date.now() - 8 * 864e5;
  me = await A.currentUser();
  check("quá 7 ngày: đăng xuất, báo lý do", me === null && /7 ngày/.test(A.sessionNote), A.sessionNote);
  window.__authTime = Date.now();
  check("sai mật khẩu: báo chung", /không đúng/.test(await err(() => A.signIn("a@b.co", "sai"))));
  check("chưa xác nhận email: gửi lại thư, không cho vào", /chưa được xác nhận/.test(await err(() => A.signIn("chuaxn@gmail.com", "dung"))) && window.__sent === true);
  me = await A.signIn("admin@gmail.com", "dung");
  check("đăng nhập đúng", me && me.email === "admin@gmail.com", me);
  await A.fbForgot("x@y.co"); check("quên mật khẩu gửi thư", window.__reset === "x@y.co");
  await A.listUsers(); check("chép danh sách quyền sang Firestore, email viết thường", store.get("users/viewer@gmail.com").role === "viewer");
  check("quyền đã gỡ ở Apps Script thì gỡ luôn ở Firestore", !store.get("users/admin@gmail.com"));

  // ---- Bản sao bản đồ (WM+, cửa hàng đối thủ, biến động) ----
  const wait = (ms) => new Promise((r) => realST(r, ms));
  const keys = (p) => [...store.keys()].filter((k) => k.startsWith(p));
  gasBoots = 0;
  let bt = await A.getBoot();
  check("lần đầu chưa có bản sao: lấy từ Apps Script rồi ghi bản sao", gasBoots === 1 && bt.snapshot.bhx.length === 3 && !!store.get("cache/meta"), gasBoots);
  bt = await A.getBoot();
  check("lần sau đọc bản sao, không gọi Apps Script", gasBoots === 1 && bt.snapshot.wm.length === 1 && bt.snapshot.comp.length === 1 && bt.changes.length === 1 && bt.settings.viewer_can_export === false && bt.snapshot.wmExpires instanceof Date && bt.snapshot.bhxUpdated === "2026-11-11 06:05", { gasBoots, s: bt.snapshot });
  store.set("cache/meta", { ...store.get("cache/meta"), wmExpires: Date.now() - 1000 });
  bt = await A.getBoot(); await wait(50);
  check("WM+ quá 48 giờ: không hiện, bản sao WM+ bị xoá", bt.snapshot.wm.length === 0 && bt.snapshot.wmVersion === "chưa có" && bt.snapshot.wmExpires === null && keys("cache_wm/").length === 0 && store.get("cache/meta").wmParts === 0, keys("cache_wm/"));
  const r2 = await A.publishWm([{ ma: " W2 ", ten: "", tinh: "HN", lat: "21.1", lng: "105.9" }]);
  bt = await A.getBoot();
  check("upload WM+: bản sao có ngay WM+ mới, hạn 48 giờ", r2.version === "v2" && bt.snapshot.wm.length === 1 && bt.snapshot.wm[0].ma === "W2" && bt.snapshot.wm[0].ten === "W2" && bt.snapshot.wm[0].lat === 21.1 && Math.abs(bt.snapshot.wmExpires - Date.now() - 48 * 36e5) < 6e4 && /^v2 — \d\d\/\d\d\/\d{4}$/.test(bt.snapshot.wmVersion), bt.snapshot);
  check("WM+ trong bản sao có hạn xoá (expireAt)", keys("cache_wm/").length === 1 && keys("cache_wm/").every((k) => store.get(k).expireAt.ms > Date.now()));
  await A.setSetting("viewer_can_export", true);
  check("đổi cài đặt: bản sao đổi theo", (await A.getBoot()).settings.viewer_can_export === true);
  bigBhx = true; store.set("cache/meta", { ...store.get("cache/meta"), syncedAt: Date.now() - 2 * 36e5 });
  gasBoots = 0; bt = await A.getBoot();
  for (let i = 0; i < 100 && store.get("cache/meta").syncedAt < Date.now() - 36e5; i++) await wait(10);
  await wait(50);
  const m2 = store.get("cache/meta");
  check("quá 1 giờ: Admin vẫn mở ngay bằng bản sao, làm mới ở nền", bt.snapshot.bhx.length === 3 && gasBoots === 1 && m2.parts.bhx >= 2, m2.parts);
  check("làm mới xong không còn phần cũ", keys("cache/").filter((k) => k !== "cache/meta").every((k) => k.startsWith("cache/" + m2.gen + "_")) && keys("cache_wm/").every((k) => k.startsWith("cache_wm/" + m2.wmGen + "_")), keys("cache"));
  bt = await A.getBoot();
  check("dữ liệu lớn chia nhiều phần vẫn đọc đủ", bt.snapshot.bhx.length === 9000 && keys("cache/").every((k) => !store.get(k).d || store.get(k).d.length < 1e6), bt.snapshot.bhx.length);
  meRole = "viewer"; store.set("users/admin@gmail.com", { role: "viewer" }); await A.currentUser();
  store.set("cache/meta", { ...store.get("cache/meta"), syncedAt: Date.now() - 31 * 36e5 });
  gasBoots = 0; const metaBefore = JSON.stringify(store.get("cache/meta"));
  bt = await A.getBoot(); await wait(50);
  check("Viewer, bản sao quá 30 giờ: lấy từ Apps Script, không ghi bản sao", gasBoots === 1 && bt.snapshot.bhx.length === 9000 && JSON.stringify(store.get("cache/meta")) === metaBefore, gasBoots);
  meRole = "admin"; bigBhx = false; store.set("users/admin@gmail.com", { role: "admin" }); await A.currentUser();

  await A.savePriceConfig([{ tinh: "Hà Nội", provinceId: "1", wardId: "2", storeId: "3" }, { tinh: "Cần Thơ", provinceId: "4", wardId: "5", storeId: "6" }]);
  const cfg = await A.priceConfig();
  check("lưu thiết lập tỉnh không giới hạn 10 tỉnh cũ, không đòi token", cfg.provinces.length === 2 && cfg.missing.length === 7, cfg);
  check("mã không phải số → lỗi", /phải là số/.test(await err(() => A.savePriceConfig([{ tinh: "X", provinceId: "a", wardId: "1", storeId: "1" }]))));
  const run = async () => { let j = await A.priceStart(), g = 0; while (j.status === "running" && g++ < 500) j = await A.priceStep(j.id); return j; };
  writes = 0; bhxCalls = 0;
  let j = await run();
  check("lấy đủ 2 tỉnh, dùng 50 SKU mỗi trang", j.status === "done" && j.summary.provinces.length === 2 && j.summary.provinces[0].rows === 110 && sizesSeen.has(50) && sizesSeen.size === 1, j);
  check("mỗi tỉnh chỉ tốn ít lượt ghi (tỉnh + lịch sử + meta + 8 nhóm SKU)", writes === 22, writes);
  const d0 = new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10);
  check("lưu theo tỉnh, không có mảng lồng", typeof store.get("price_cur/ha_noi").items === "string" && store.get("price_cur/can_tho").tinh === "Cần Thơ");
  let p = await A.getPrices();
  check("đọc lại đúng dạng báo cáo cần", p.items.length === 220 && p.skus.length === 110 && p.runs.length === 2 && p.items[0].final > 0 && p.items[0].promo === true && p.items[0].first_seen === d0, p.items[0]);
  check("ngành, đơn vị, thương hiệu đúng", p.skus[0].cat === "Sữa" && p.skus[0].unit === "Gói" && p.skus[0].url.startsWith("https://www.bachhoaxanh.com/"));
  let h = await A.getPriceHist("Hà Nội");
  check("lịch sử chỉ của tỉnh được hỏi", h.length === 110 && h.every((r) => r[1] === "Hà Nội"), h.length);
  priceBump = 500; j = await run();
  check("cùng ngày chạy lại: phát hiện đổi giá", j.status === "done" && j.summary.provinces[0].up === 4, j.summary);
  h = await A.getPriceHist("Hà Nội");
  check("cùng ngày: gộp lịch sử, không nhân đôi", h.length === 110, h.length);
  bhxMode = "few"; j = await run();
  check("tỉnh ít SKU bất thường: chờ xác nhận, dữ liệu cũ giữ nguyên", j.status === "confirm" && JSON.parse(store.get("price_cur/ha_noi").items).length === 110, j);
  j = await A.priceFinish(j.id);
  check("Admin xác nhận thì lưu và chạy tiếp tỉnh sau", j.status === "running" && j.summary.provinces[0].rows === 3, j);
  await A.priceCancel();
  bhxMode = "403"; j = await run();
  check("BHX chặn: tạm dừng, báo rõ, dữ liệu giữ nguyên", j.status === "paused" && /403/.test(j.msg), j);
  bhxMode = "ok"; j = await A.priceStart();
  check("bấm lại: chạy tiếp đúng lần cũ", j.status === "running", j);
  await A.priceCancel();
  bhxMode = "none"; j = await run();
  check("BHX trả rỗng: không ghi đè dữ liệu", j.status === "paused" && /không trả SKU/.test(j.msg), j);
  await A.priceCancel();
  out.textContent += `\nKẾT QUẢ: ${fail ? "CÓ LỖI" : "TẤT CẢ ĐẠT"} (${pass}/${pass + fail})`;
  document.title = fail ? "FAIL" : "PASS"; window.__result = { pass, fail };
})().catch((e) => { document.getElementById("out").textContent += "LỖI CHẠY TEST: " + e.stack; window.__result = { error: String(e) }; });
</script>
